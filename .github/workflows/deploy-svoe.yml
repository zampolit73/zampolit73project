name: Deploy SVOE family finance

on:
  workflow_run:
    workflows: ["CI and Deploy"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svoe-family-finance-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore application package and check syntax
        run: |
          set -euo pipefail
          base64 -d svoe/source.tar.gz.b64 > /tmp/svoe.tar.gz
          mkdir -p /tmp/svoe-app
          tar -xzf /tmp/svoe.tar.gz -C /tmp/svoe-app
          python3 -m py_compile /tmp/svoe-app/server.py
          test -s /tmp/svoe-app/public/index.html
          test -s /tmp/svoe-app/public/app.js

      - name: Configure SSH using existing VPS secrets
        env:
          VPS_PWD: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PWD"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cat > "$HOME/.ssh/askpass.sh" <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "$VPS_PWD"
          ASKPASS
          chmod 700 "$HOME/.ssh/askpass.sh"
          timeout 12 ssh-keyscan -T 5 -p 22 -H "$VPS_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Transfer application package
        env:
          VPS_PWD: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_ASKPASS: /home/runner/.ssh/askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: ":0"
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            /tmp/svoe.tar.gz "$VPS_USER@$VPS_HOST:/tmp/svoe-family-finance.tar.gz" </dev/null

      - name: Install service and proxy behind existing HTTPS
        env:
          VPS_PWD: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_ASKPASS: /home/runner/.ssh/askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: ":0"
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" 'bash -se' </dev/null <<'REMOTE'
          set -Eeuo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif sudo -n true >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "No passwordless sudo; aborting without changing server"
            exit 12
          fi

          command -v python3 >/dev/null || { echo "Python3 required"; exit 13; }
          $SUDO python3 -c 'import sys; assert sys.version_info >= (3,10)'
          test -f /etc/nginx/sites-available/zampolit73project || { echo "Main nginx site not present"; exit 14; }
          test -f /tmp/svoe-family-finance.tar.gz
          $SUDO mkdir -p /opt/svoe/public
          if ! id svoe >/dev/null 2>&1; then
            $SUDO useradd --system --home-dir /opt/svoe --shell /usr/sbin/nologin svoe
          fi
          $SUDO install -d -m 0700 -o svoe -g svoe /opt/svoe/data
          STAGING="$(mktemp -d)"
          trap 'rm -rf "$STAGING"; rm -f /tmp/svoe-family-finance.tar.gz' EXIT
          tar -xzf /tmp/svoe-family-finance.tar.gz -C "$STAGING"
          test -f "$STAGING/server.py" && test -f "$STAGING/public/index.html"
          $SUDO install -m 0644 -o root -g root "$STAGING/server.py" /opt/svoe/server.py
          $SUDO cp -a "$STAGING/public/." /opt/svoe/public/
          $SUDO chown -R root:root /opt/svoe/public
          $SUDO tee /etc/systemd/system/svoe.service >/dev/null <<'UNIT'
          [Unit]
          Description=SVOE family finance private PWA
          After=network.target
          [Service]
          Type=simple
          User=svoe
          Group=svoe
          WorkingDirectory=/opt/svoe
          ExecStart=/usr/bin/python3 /opt/svoe/server.py --host 127.0.0.1 --port 8765
          Restart=on-failure
          RestartSec=5
          Environment=SVOE_TIMEZONE=Europe/Ulyanovsk
          NoNewPrivileges=yes
          PrivateTmp=yes
          ProtectSystem=strict
          ProtectHome=yes
          ReadWritePaths=/opt/svoe/data
          UMask=0077
          [Install]
          WantedBy=multi-user.target
          UNIT
          $SUDO systemctl daemon-reload
          $SUDO systemctl enable --now svoe
          $SUDO systemctl restart svoe
          ready=0
          for attempt in $(seq 1 25); do
            if curl -fsS --max-time 3 http://127.0.0.1:8765/api/bootstrap >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "SVOE failed to respond after startup:"
            $SUDO systemctl status svoe --no-pager -l || true
            $SUDO journalctl -u svoe -n 30 --no-pager || true
            exit 19
          fi
          $SUDO systemctl is-active --quiet svoe

          # Patch only the existing TLS vhost; preserve every other app and its paths.
          $SUDO cp -a /etc/nginx/sites-available/zampolit73project /etc/nginx/sites-available/zampolit73project.pre-svoe
          $SUDO python3 - <<'PY'
          from pathlib import Path
          p=Path('/etc/nginx/sites-available/zampolit73project')
          s=p.read_text()
          marker='# SVOE FAMILY FINANCE BEGIN'
          if marker in s:
              print('Proxy already configured')
          else:
              start=s.find('listen 443 ssl')
              if start<0: raise SystemExit('No HTTPS vhost, leaving unchanged')
              loc=s.find('location / {',start)
              if loc<0: raise SystemExit('No standard HTTPS location found')
              insert='''# SVOE FAMILY FINANCE BEGIN
              location = /svoe { return 308 /svoe/; }
              location ^~ /svoe/ {
                  proxy_pass http://127.0.0.1:8765/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_read_timeout 30s;
                  client_max_body_size 64k;
              }
              # SVOE FAMILY FINANCE END

              '''
              s=s[:loc]+insert+s[loc:]
              p.write_text(s)
          PY
          if ! $SUDO nginx -t; then
            $SUDO cp -a /etc/nginx/sites-available/zampolit73project.pre-svoe /etc/nginx/sites-available/zampolit73project
            $SUDO nginx -t
            echo "Proxy verification failed and old nginx config restored."
            exit 18
          fi
          $SUDO systemctl reload nginx
          curl -fsS --max-time 12 --resolve zampolit73.duckdns.org:443:127.0.0.1 https://zampolit73.duckdns.org/svoe/ >/dev/null
          echo "SVOE production health check passed"
          REMOTE

      - name: Verify public HTTPS app
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 3 --connect-timeout 6 --max-time 15 \
            https://zampolit73.duckdns.org/svoe/ | grep -q 'СВОЁ'
