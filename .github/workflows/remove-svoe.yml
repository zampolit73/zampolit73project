name: Uninstall discontinued SVOE PWA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-svoe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: svoe-uninstall
  cancel-in-progress: false

jobs:
  uninstall:
    name: Remove only SVOE from VPS
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Configure SSH from existing encrypted repository secrets
        env:
          VPS_PWD: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" && test -n "$VPS_PWD"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/askpass.sh <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "$VPS_PWD"
          ASKPASS
          chmod 700 ~/.ssh/askpass.sh
          timeout 12 ssh-keyscan -T 5 -p 22 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Remove dedicated SVOE service, data and proxy only
        env:
          VPS_PWD: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_ASKPASS: /home/runner/.ssh/askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: ":0"
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -Eeuo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif sudo -n true >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "Passwordless sudo required; nothing removed."
            exit 11
          fi

          # Do not stop/alter the Laravel site, bot, PHP-FPM or shared databases.
          if [ -f /etc/systemd/system/svoe.service ]; then
            $SUDO systemctl stop svoe.service || true
            $SUDO systemctl disable svoe.service || true
            $SUDO rm -f /etc/systemd/system/svoe.service
            $SUDO systemctl daemon-reload
            $SUDO systemctl reset-failed svoe.service 2>/dev/null || true
          fi

          NGINX_SITE=/etc/nginx/sites-available/zampolit73project
          if [ -f "$NGINX_SITE" ]; then
            BACKUP="$(mktemp /tmp/svoe-nginx-rollback.XXXXXX)"
            $SUDO cp -a "$NGINX_SITE" "$BACKUP"
            $SUDO python3 - <<'PY'
          from pathlib import Path
          p=Path('/etc/nginx/sites-available/zampolit73project')
          s=p.read_text()
          begin='# SVOE FAMILY FINANCE BEGIN'
          end='# SVOE FAMILY FINANCE END'
          if (begin in s) != (end in s):
              raise SystemExit('Only one SVOE proxy marker exists; refusing to alter nginx')
          if begin in s:
              a=s.index(begin)
              b=s.index(end, a)+len(end)
              s=s[:a]+s[b:]
              p.write_text(s)
              print('Removed SVOE proxy location only')
          else:
              print('SVOE proxy location already absent')
          PY
            if ! $SUDO nginx -t; then
              $SUDO cp -a "$BACKUP" "$NGINX_SITE"
              $SUDO nginx -t
              echo "Nginx validation failed: restored original config"
              exit 12
            fi
            $SUDO systemctl reload nginx
            rm -f "$BACKUP" || $SUDO rm -f "$BACKUP"
          fi

          # /opt/svoe/data is the app's private SQLite database. User requested deletion.
          $SUDO rm -rf -- /opt/svoe
          $SUDO rm -f -- /tmp/svoe-family-finance.tar.gz
          $SUDO rm -f -- /etc/nginx/sites-available/zampolit73project.pre-svoe
          if id svoe >/dev/null 2>&1; then
            if ! pgrep -u svoe >/dev/null 2>&1; then
              $SUDO userdel svoe
            else
              echo 'Dedicated svoe OS user still has processes; leaving user to avoid killing unrelated processes'
            fi
          fi

          ! test -d /opt/svoe
          ! test -f /etc/systemd/system/svoe.service
          ! $SUDO nginx -T 2>/dev/null | grep -q '# SVOE FAMILY FINANCE BEGIN'
          curl -fsS --max-time 12 https://zampolit73.duckdns.org/up >/dev/null
          echo 'SVOE removed, original site health check passed'
          REMOTE

      - name: Verify removed app no longer responds and original site stays online
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 6 --max-time 15 https://zampolit73.duckdns.org/up >/dev/null
          response="$(curl -LsS --connect-timeout 6 --max-time 15 https://zampolit73.duckdns.org/svoe/ || true)"
          if printf '%s' "$response" | grep -q '<title>СВОЁ'; then
            echo 'Unexpected: SVOE app still reachable'
            exit 13
          fi
          echo 'Public checks passed'
