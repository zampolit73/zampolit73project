name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, sqlite3, pdo_sqlite, xml, curl, zip, intl, bcmath
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare test environment
        run: |
          cp .env.example .env
          mkdir -p database bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          touch database/database.sqlite

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install frontend dependencies
        run: npm install

      - name: Generate test application key
        run: php artisan key:generate

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Build frontend
        run: npm run build

      - name: Package release
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='database/database.sqlite' \
            -czf /tmp/release.tar.gz .
          mv /tmp/release.tar.gz release.tar.gz

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    env:
      APP_DOMAIN: zampolit73.duckdns.org

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}

      - name: Install SSH tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Add VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p 22 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release
        env:
          SSHPASS: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          sshpass -e scp \
            -P 22 \
            -o StrictHostKeyChecking=yes \
            release.tar.gz \
            "$VPS_USER@$VPS_HOST:/tmp/zampolit73-${GITHUB_SHA}.tar.gz"

      - name: Deploy HTTPS stack
        env:
          SSHPASS: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          sshpass -e ssh \
            -p 22 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "APP_DOMAIN='$APP_DOMAIN' RELEASE_SHA='$GITHUB_SHA' bash -se" <<'REMOTE'
          set -euo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif sudo -n true >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "Deployment user needs root or passwordless sudo."
            exit 20
          fi

          APP_NAME="zampolit73project"
          BASE_DIR="/var/www/$APP_NAME"
          RELEASES_DIR="$BASE_DIR/releases"
          SHARED_DIR="$BASE_DIR/shared"
          RELEASE_DIR="$RELEASES_DIR/$RELEASE_SHA"
          ARCHIVE="/tmp/zampolit73-$RELEASE_SHA.tar.gz"
          WEB_ROOT="$BASE_DIR/current/public"
          NGINX_SITE="/etc/nginx/sites-available/$APP_NAME"

          RESOLVED_IPS="$(getent ahostsv4 "$APP_DOMAIN" | awk '{print $1}' | sort -u || true)"
          if [ -z "$RESOLVED_IPS" ]; then
            echo "DNS for $APP_DOMAIN does not resolve yet."
            exit 21
          fi
          echo "DNS for $APP_DOMAIN resolves."

          $SUDO apt-get update
          $SUDO apt-get install -y ca-certificates curl unzip nginx composer software-properties-common certbot

          if ! apt-cache show php8.3-fpm >/dev/null 2>&1; then
            $SUDO add-apt-repository ppa:ondrej/php -y
            $SUDO apt-get update
          fi

          $SUDO apt-get install -y \
            php8.3-cli php8.3-fpm php8.3-mbstring php8.3-xml php8.3-curl \
            php8.3-sqlite3 php8.3-zip php8.3-bcmath php8.3-intl

          $SUDO mkdir -p \
            "$RELEASES_DIR" \
            "$SHARED_DIR/database" \
            "$SHARED_DIR/storage/app/public" \
            "$SHARED_DIR/storage/framework/cache" \
            "$SHARED_DIR/storage/framework/sessions" \
            "$SHARED_DIR/storage/framework/views" \
            "$SHARED_DIR/storage/logs"

          $SUDO rm -rf "$RELEASE_DIR"
          $SUDO mkdir -p "$RELEASE_DIR"
          $SUDO tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          $SUDO rm -f "$ARCHIVE"

          ENV_FILE="$SHARED_DIR/.env"
          if [ ! -f "$ENV_FILE" ]; then
            $SUDO cp "$RELEASE_DIR/.env.example" "$ENV_FILE"
          fi

          set_env() {
            key="$1"
            value="$2"
            if $SUDO grep -q "^$key=" "$ENV_FILE"; then
              $SUDO sed -i "s|^$key=.*|$key=$value|" "$ENV_FILE"
            else
              printf '%s=%s\n' "$key" "$value" | $SUDO tee -a "$ENV_FILE" >/dev/null
            fi
          }

          set_env APP_NAME "$APP_NAME"
          set_env APP_ENV production
          set_env APP_DEBUG false
          set_env APP_URL "https://$APP_DOMAIN"
          set_env APP_LOCALE ru
          set_env DB_CONNECTION sqlite
          set_env DB_DATABASE "$SHARED_DIR/database/database.sqlite"
          set_env SESSION_DRIVER file
          set_env SESSION_SECURE_COOKIE true
          set_env CACHE_STORE file
          set_env QUEUE_CONNECTION sync
          set_env LOG_LEVEL warning

          $SUDO touch "$SHARED_DIR/database/database.sqlite"

          $SUDO rm -rf "$RELEASE_DIR/storage"
          $SUDO ln -s "$SHARED_DIR/storage" "$RELEASE_DIR/storage"
          $SUDO ln -s "$ENV_FILE" "$RELEASE_DIR/.env"
          $SUDO mkdir -p "$RELEASE_DIR/bootstrap/cache"

          cd "$RELEASE_DIR"
          $SUDO php8.3 /usr/bin/composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-progress

          if ! $SUDO grep -q '^APP_KEY=base64:' "$ENV_FILE"; then
            $SUDO php8.3 artisan key:generate --force
          fi

          $SUDO php8.3 scripts/ensure-vapid.php "$ENV_FILE" "https://$APP_DOMAIN"

          $SUDO chown -R www-data:www-data "$SHARED_DIR/storage" "$SHARED_DIR/database" "$RELEASE_DIR/bootstrap/cache"
          $SUDO chmod -R ug+rwX "$SHARED_DIR/storage" "$SHARED_DIR/database" "$RELEASE_DIR/bootstrap/cache"

          $SUDO php8.3 artisan config:clear
          $SUDO php8.3 artisan migrate --force
          $SUDO php8.3 artisan storage:link || true
          $SUDO php8.3 artisan optimize

          $SUDO ln -sfn "$RELEASE_DIR" "$BASE_DIR/current.new"
          $SUDO mv -Tf "$BASE_DIR/current.new" "$BASE_DIR/current"

          $SUDO tee "$NGINX_SITE" >/dev/null <<NGINX_HTTP
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name $APP_DOMAIN;

              root /var/www/zampolit73project/current/public;
              index index.php;
              charset utf-8;

              location ^~ /.well-known/acme-challenge/ {
                  try_files \$uri =404;
              }

              location / {
                  try_files \$uri \$uri/ /index.php?\$query_string;
              }

              location ~ ^/index\.php(/|\$) {
                  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
                  fastcgi_param SCRIPT_FILENAME \$realpath_root\$fastcgi_script_name;
                  include fastcgi_params;
                  fastcgi_hide_header X-Powered-By;
              }

              location ~ /\.(?!well-known).* {
                  deny all;
              }
          }
          NGINX_HTTP

          $SUDO ln -sfn "$NGINX_SITE" "/etc/nginx/sites-enabled/$APP_NAME"
          $SUDO rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/test

          if command -v ufw >/dev/null 2>&1 && $SUDO ufw status | grep -q '^Status: active'; then
            $SUDO ufw allow 22/tcp
            $SUDO ufw allow 80/tcp
            $SUDO ufw allow 443/tcp
          fi

          $SUDO nginx -t
          $SUDO systemctl enable php8.3-fpm nginx
          $SUDO systemctl restart php8.3-fpm
          $SUDO systemctl restart nginx

          curl -fsS --retry 5 --retry-delay 2 \
            --resolve "$APP_DOMAIN:80:127.0.0.1" \
            "http://$APP_DOMAIN/up" >/dev/null

          $SUDO certbot certonly \
            --webroot \
            --webroot-path "$WEB_ROOT" \
            --domain "$APP_DOMAIN" \
            --non-interactive \
            --agree-tos \
            --register-unsafely-without-email \
            --keep-until-expiring

          CERT_DIR="/etc/letsencrypt/live/$APP_DOMAIN"
          test -f "$CERT_DIR/fullchain.pem"
          test -f "$CERT_DIR/privkey.pem"

          $SUDO tee "$NGINX_SITE" >/dev/null <<NGINX_HTTPS
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name $APP_DOMAIN;

              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/zampolit73project/current/public;
                  try_files \$uri =404;
              }

              location / {
                  return 301 https://\$host\$request_uri;
              }
          }

          server {
              listen 443 ssl http2;
              listen [::]:443 ssl http2;
              server_name $APP_DOMAIN;

              root /var/www/zampolit73project/current/public;
              index index.php;
              charset utf-8;

              ssl_certificate /etc/letsencrypt/live/$APP_DOMAIN/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/$APP_DOMAIN/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_session_cache shared:SSL:10m;
              ssl_session_timeout 10m;

              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;

              location / {
                  try_files \$uri \$uri/ /index.php?\$query_string;
              }

              location = /favicon.ico { access_log off; log_not_found off; }
              location = /robots.txt  { access_log off; log_not_found off; }

              location ~ ^/index\.php(/|\$) {
                  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
                  fastcgi_param SCRIPT_FILENAME \$realpath_root\$fastcgi_script_name;
                  include fastcgi_params;
                  fastcgi_hide_header X-Powered-By;
              }

              location ~ /\.(?!well-known).* {
                  deny all;
              }
          }
          NGINX_HTTPS

          $SUDO nginx -t
          $SUDO systemctl reload nginx
          $SUDO systemctl enable --now certbot.timer >/dev/null 2>&1 || true

          curl -fsS --retry 5 --retry-delay 2 \
            --resolve "$APP_DOMAIN:443:127.0.0.1" \
            "https://$APP_DOMAIN/up" >/dev/null

          curl -fsS --retry 5 --retry-delay 2 \
            --resolve "$APP_DOMAIN:443:127.0.0.1" \
            "https://$APP_DOMAIN/site.webmanifest" >/dev/null

          curl -fsS --retry 5 --retry-delay 2 \
            --resolve "$APP_DOMAIN:443:127.0.0.1" \
            "https://$APP_DOMAIN/sw.js" >/dev/null

          echo "HTTPS and PWA endpoints are healthy locally."

          ls -1dt "$RELEASES_DIR"/* 2>/dev/null | tail -n +4 | xargs -r $SUDO rm -rf
          REMOTE

      - name: Verify public HTTPS
        run: |
          curl -fsS \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            "https://$APP_DOMAIN/up" >/dev/null

          curl -fsS \
            --retry 10 \
            --retry-delay 3 \
            --retry-connrefused \
            "https://$APP_DOMAIN/" >/dev/null

          curl -fsS "https://$APP_DOMAIN/site.webmanifest" >/dev/null
          curl -fsS "https://$APP_DOMAIN/sw.js" >/dev/null

          redirect="$(curl -sS -o /dev/null -w '%{redirect_url}' "http://$APP_DOMAIN/")"
          case "$redirect" in
            "https://$APP_DOMAIN"/*) ;;
            *)
              echo "HTTP does not redirect to HTTPS: $redirect"
              exit 40
              ;;
          esac

          echo "Public HTTPS, redirect and PWA endpoint checks passed."

      - name: Notify administrators about successful deploy
        env:
          SSHPASS: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          sshpass -e ssh \
            -p 22 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd /var/www/zampolit73project/current && php8.3 artisan push:deploy-success"
