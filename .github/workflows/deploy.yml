name: CI and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Only the newest push to main may continue toward production.
  # PR/manual runs have separate groups and cannot cancel production.
  group: ${{ github.event_name == 'push' && 'production-main' || format('ci-{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: true

env:
  APP_DOMAIN: zampolit73.duckdns.org

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, sqlite3, pdo_sqlite, xml, curl, zip, intl, bcmath
          coverage: none

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Prepare test environment
        run: |
          cp .env.example .env
          mkdir -p database bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          touch database/database.sqlite

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Generate test application key
        run: php artisan key:generate

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Package backend source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.env' \
            --exclude='database/database.sqlite' \
            --exclude='public/build' \
            -czf /tmp/backend-source.tar.gz .
          mv /tmp/backend-source.tar.gz backend-source.tar.gz

      - name: Upload backend source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: backend-source-${{ github.sha }}
          path: backend-source.tar.gz
          if-no-files-found: error
          retention-days: 1

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm install --prefer-offline --no-audit --no-fund

      - name: Test Quake MIP encoder
        run: npm run test:quake-mip

      - name: Build Vite assets
        run: npm run build

      - name: Package frontend build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: tar -czf frontend-build.tar.gz public/build

      - name: Upload frontend build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: frontend-build.tar.gz
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5

    steps:
      - name: Download backend source
        uses: actions/download-artifact@v4
        with:
          name: backend-source-${{ github.sha }}
          path: artifacts/backend

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.sha }}
          path: artifacts/frontend

      - name: Assemble release
        run: |
          mkdir -p release
          tar -xzf artifacts/backend/backend-source.tar.gz -C release
          tar -xzf artifacts/frontend/frontend-build.tar.gz -C release
          tar -czf release.tar.gz -C release .

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - name: Download release
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}

      - name: Configure SSH authentication
        env:
          VPS_PWD: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/askpass.sh <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "$VPS_PWD"
          ASKPASS
          chmod 700 ~/.ssh/askpass.sh

          timeout 10s ssh-keyscan -T 5 -p 22 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release to VPS
        env:
          VPS_PWD: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SSH_ASKPASS: /home/runner/.ssh/askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: ":0"
        run: |
          scp \
            -P 22 \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            release.tar.gz \
            "$VPS_USER@$VPS_HOST:/tmp/zampolit73-${GITHUB_SHA}.tar.gz" </dev/null

          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
            telegram_token_file="$(mktemp)"
            trap 'rm -f "$telegram_token_file"' EXIT
            chmod 600 "$telegram_token_file"
            printf '%s' "$TELEGRAM_BOT_TOKEN" > "$telegram_token_file"

            scp \
              -P 22 \
              -o StrictHostKeyChecking=yes \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=2 \
              "$telegram_token_file" \
              "$VPS_USER@$VPS_HOST:/tmp/zampolit73-telegram-token-${GITHUB_SHA}" </dev/null
          fi

      - name: Activate release
        env:
          VPS_PWD: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_ASKPASS: /home/runner/.ssh/askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: ":0"
        run: |
          ssh \
            -p 22 \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$VPS_USER@$VPS_HOST" \
            "APP_DOMAIN='$APP_DOMAIN' RELEASE_SHA='$GITHUB_SHA' bash -se" </dev/null <<'REMOTE'
          set -euo pipefail

          if [ "$(id -u)" -eq 0 ]; then
            SUDO=""
          elif sudo -n true >/dev/null 2>&1; then
            SUDO="sudo"
          else
            echo "Deployment user needs root or passwordless sudo."
            exit 20
          fi

          APP_NAME="zampolit73project"
          BASE_DIR="/var/www/$APP_NAME"
          RELEASES_DIR="$BASE_DIR/releases"
          SHARED_DIR="$BASE_DIR/shared"
          RELEASE_DIR="$RELEASES_DIR/$RELEASE_SHA"
          ARCHIVE="/tmp/zampolit73-$RELEASE_SHA.tar.gz"
          TELEGRAM_TOKEN_FILE="/tmp/zampolit73-telegram-token-$RELEASE_SHA"
          NGINX_SITE="/etc/nginx/sites-available/$APP_NAME"

          cleanup_sensitive_files() {
            $SUDO rm -f "$TELEGRAM_TOKEN_FILE"
          }
          trap cleanup_sensitive_files EXIT
          CERT_DIR="/etc/letsencrypt/live/$APP_DOMAIN"

          RESOLVED_IPS="$(getent ahostsv4 "$APP_DOMAIN" | awk '{print $1}' | sort -u || true)"
          if [ -z "$RESOLVED_IPS" ]; then
            echo "DNS for $APP_DOMAIN does not resolve."
            exit 21
          fi

          needs_provision=0
          for cmd in curl nginx certbot composer php8.3; do
            command -v "$cmd" >/dev/null 2>&1 || needs_provision=1
          done

          if command -v php8.3 >/dev/null 2>&1; then
            php8.3 -r '
              foreach (["mbstring", "pdo_sqlite", "xml", "curl", "zip", "bcmath", "intl"] as $extension) {
                  if (!extension_loaded($extension)) exit(1);
              }
            ' || needs_provision=1
          fi

          if [ "$needs_provision" -eq 1 ]; then
            echo "Provisioning missing server packages..."
            $SUDO apt-get update
            $SUDO apt-get install -y ca-certificates curl unzip nginx composer software-properties-common certbot

            if ! apt-cache show php8.3-fpm >/dev/null 2>&1; then
              $SUDO add-apt-repository ppa:ondrej/php -y
              $SUDO apt-get update
            fi

            $SUDO apt-get install -y \
              php8.3-cli php8.3-fpm php8.3-mbstring php8.3-xml php8.3-curl \
              php8.3-sqlite3 php8.3-zip php8.3-bcmath php8.3-intl

            $SUDO systemctl enable --now php8.3-fpm nginx
            $SUDO systemctl enable --now certbot.timer >/dev/null 2>&1 || true
          else
            echo "Server packages already provisioned; skipping apt."
            $SUDO systemctl is-active --quiet php8.3-fpm || $SUDO systemctl start php8.3-fpm
            $SUDO systemctl is-active --quiet nginx || $SUDO systemctl start nginx
          fi

          $SUDO mkdir -p \
            "$RELEASES_DIR" \
            "$SHARED_DIR/database" \
            "$SHARED_DIR/storage/app/public" \
            "$SHARED_DIR/storage/framework/cache" \
            "$SHARED_DIR/storage/framework/sessions" \
            "$SHARED_DIR/storage/framework/views" \
            "$SHARED_DIR/storage/logs"

          $SUDO rm -rf "$RELEASE_DIR"
          $SUDO mkdir -p "$RELEASE_DIR"
          $SUDO tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          $SUDO rm -f "$ARCHIVE"

          ENV_FILE="$SHARED_DIR/.env"
          if [ ! -f "$ENV_FILE" ]; then
            $SUDO cp "$RELEASE_DIR/.env.example" "$ENV_FILE"
          fi

          set_env() {
            key="$1"
            value="$2"
            if $SUDO grep -q "^$key=" "$ENV_FILE"; then
              $SUDO sed -i "s|^$key=.*|$key=$value|" "$ENV_FILE"
            else
              printf '%s=%s\n' "$key" "$value" | $SUDO tee -a "$ENV_FILE" >/dev/null
            fi
          }

          set_env APP_NAME "$APP_NAME"
          set_env APP_ENV production
          set_env APP_DEBUG false
          set_env APP_URL "https://$APP_DOMAIN"
          set_env APP_LOCALE ru
          set_env DB_CONNECTION sqlite
          set_env DB_DATABASE "$SHARED_DIR/database/database.sqlite"
          set_env SESSION_DRIVER file
          set_env SESSION_SECURE_COOKIE true
          set_env CACHE_STORE file
          set_env QUEUE_CONNECTION database
          set_env QUEUE_FAILED_DRIVER null
          set_env LOG_LEVEL warning

          TELEGRAM_SETUP_REQUESTED=0
          if [ -s "$TELEGRAM_TOKEN_FILE" ]; then
            TELEGRAM_BOT_TOKEN_VALUE="$($SUDO cat "$TELEGRAM_TOKEN_FILE")"
            $SUDO rm -f "$TELEGRAM_TOKEN_FILE"

            if [ -n "$TELEGRAM_BOT_TOKEN_VALUE" ]; then
              TELEGRAM_WEBHOOK_SECRET="$(
                printf '%s' "zampolit73-webhook-v1:$TELEGRAM_BOT_TOKEN_VALUE"                   | sha256sum                   | awk '{print $1}'
              )"

              set_env TELEGRAM_BOT_TOKEN "$TELEGRAM_BOT_TOKEN_VALUE"
              set_env TELEGRAM_BOT_WEBHOOK_SECRET "$TELEGRAM_WEBHOOK_SECRET"
              TELEGRAM_SETUP_REQUESTED=1

              unset TELEGRAM_WEBHOOK_SECRET
            fi

            unset TELEGRAM_BOT_TOKEN_VALUE
          else
            $SUDO rm -f "$TELEGRAM_TOKEN_FILE"
          fi

          $SUDO touch "$SHARED_DIR/database/database.sqlite"

          $SUDO rm -rf "$RELEASE_DIR/storage"
          $SUDO ln -s "$SHARED_DIR/storage" "$RELEASE_DIR/storage"
          $SUDO ln -s "$ENV_FILE" "$RELEASE_DIR/.env"
          $SUDO mkdir -p "$RELEASE_DIR/bootstrap/cache"

          if [ -d "$BASE_DIR/current/vendor" ] \
            && [ -f "$BASE_DIR/current/composer.lock" ] \
            && [ -f "$RELEASE_DIR/composer.lock" ] \
            && cmp -s "$BASE_DIR/current/composer.lock" "$RELEASE_DIR/composer.lock"; then
            echo "Composer lock unchanged; reusing vendor from current release."
            $SUDO cp -al "$BASE_DIR/current/vendor" "$RELEASE_DIR/vendor"
          else
            echo "Composer dependencies changed; installing production vendor."
            cd "$RELEASE_DIR"
            $SUDO php8.3 /usr/bin/composer install \
              --no-dev \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader \
              --no-progress
          fi

          cd "$RELEASE_DIR"

          if ! $SUDO grep -q '^APP_KEY=base64:' "$ENV_FILE"; then
            $SUDO php8.3 artisan key:generate --force
          fi

          $SUDO php8.3 scripts/ensure-vapid.php "$ENV_FILE" "https://$APP_DOMAIN"

          $SUDO chown -R www-data:www-data "$SHARED_DIR/storage" "$SHARED_DIR/database" "$RELEASE_DIR/bootstrap/cache"
          $SUDO chmod -R ug+rwX "$SHARED_DIR/storage" "$SHARED_DIR/database" "$RELEASE_DIR/bootstrap/cache"

          $SUDO php8.3 artisan config:clear
          $SUDO php8.3 artisan migrate --force
          $SUDO php8.3 artisan storage:link || true
          $SUDO php8.3 artisan optimize

          $SUDO ln -sfn "$RELEASE_DIR" "$BASE_DIR/current.new"
          $SUDO mv -Tf "$BASE_DIR/current.new" "$BASE_DIR/current"
          WEB_ROOT="$BASE_DIR/current/public"

          QUEUE_WORKER_SERVICE="$APP_NAME-vacancy-source-worker"
          $SUDO tee "/etc/systemd/system/$QUEUE_WORKER_SERVICE.service" >/dev/null <<QUEUE_WORKER
          [Unit]
          Description=Zampolit73 Vacancy Source Laravel queue worker
          After=network.target php8.3-fpm.service

          [Service]
          Type=simple
          User=www-data
          Group=www-data
          WorkingDirectory=/var/www/zampolit73project/current
          ExecStart=/usr/bin/php8.3 /var/www/zampolit73project/current/artisan queue:work database --queue=vacancy-source --sleep=1 --tries=1 --timeout=330
          Restart=always
          RestartSec=3
          KillSignal=SIGTERM
          TimeoutStopSec=360

          [Install]
          WantedBy=multi-user.target
          QUEUE_WORKER

          $SUDO systemctl daemon-reload
          $SUDO systemctl enable "$QUEUE_WORKER_SERVICE" >/dev/null
          $SUDO systemctl restart "$QUEUE_WORKER_SERVICE"
          $SUDO systemctl is-active --quiet "$QUEUE_WORKER_SERVICE"

          if [ ! -f "$CERT_DIR/fullchain.pem" ] || [ ! -f "$CERT_DIR/privkey.pem" ]; then
            echo "TLS certificate missing; bootstrapping HTTP for Certbot."

            $SUDO tee "$NGINX_SITE" >/dev/null <<NGINX_HTTP
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name $APP_DOMAIN;

              root /var/www/zampolit73project/current/public;
              index index.php;

              location ^~ /.well-known/acme-challenge/ {
                  try_files \$uri =404;
              }

              location / {
                  try_files \$uri \$uri/ /index.php?\$query_string;
              }

              location ~ ^/index\.php(/|\$) {
                  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
                  fastcgi_param SCRIPT_FILENAME \$realpath_root\$fastcgi_script_name;
                  include fastcgi_params;
              }
          }
          NGINX_HTTP

            $SUDO ln -sfn "$NGINX_SITE" "/etc/nginx/sites-enabled/$APP_NAME"
            $SUDO rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/test
            $SUDO nginx -t
            $SUDO systemctl reload nginx

            curl -fsS --connect-timeout 3 --max-time 10 \
              --resolve "$APP_DOMAIN:80:127.0.0.1" \
              "http://$APP_DOMAIN/up" >/dev/null

            $SUDO certbot certonly \
              --webroot \
              --webroot-path "$WEB_ROOT" \
              --domain "$APP_DOMAIN" \
              --non-interactive \
              --agree-tos \
              --register-unsafely-without-email

            $SUDO systemctl enable --now certbot.timer >/dev/null 2>&1 || true
          else
            echo "TLS certificate already present; skipping Certbot issuance."
          fi

          $SUDO tee "$NGINX_SITE" >/dev/null <<NGINX_HTTPS
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name $APP_DOMAIN;

              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/zampolit73project/current/public;
                  try_files \$uri =404;
              }

              location / {
                  return 301 https://\$host\$request_uri;
              }
          }

          server {
              listen 443 ssl http2;
              listen [::]:443 ssl http2;
              server_name $APP_DOMAIN;

              root /var/www/zampolit73project/current/public;
              index index.php;
              charset utf-8;

              ssl_certificate /etc/letsencrypt/live/$APP_DOMAIN/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/$APP_DOMAIN/privkey.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_session_cache shared:SSL:10m;
              ssl_session_timeout 10m;

              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;

              location / {
                  try_files \$uri \$uri/ /index.php?\$query_string;
              }

              location = /favicon.ico { access_log off; log_not_found off; }
              location = /robots.txt  { access_log off; log_not_found off; }

              location ~ ^/index\.php(/|\$) {
                  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
                  fastcgi_param SCRIPT_FILENAME \$realpath_root\$fastcgi_script_name;
                  include fastcgi_params;
                  fastcgi_hide_header X-Powered-By;
              }

              location ~ /\.(?!well-known).* {
                  deny all;
              }
          }
          NGINX_HTTPS

          $SUDO ln -sfn "$NGINX_SITE" "/etc/nginx/sites-enabled/$APP_NAME"
          $SUDO rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/test

          if command -v ufw >/dev/null 2>&1 && $SUDO ufw status | grep -q '^Status: active'; then
            $SUDO ufw allow 22/tcp >/dev/null
            $SUDO ufw allow 80/tcp >/dev/null
            $SUDO ufw allow 443/tcp >/dev/null
          fi

          $SUDO nginx -t
          $SUDO systemctl reload nginx
          sleep 1

          local_https_check() {
            url="$1"
            curl -fsS \
              --connect-timeout 3 \
              --max-time 8 \
              --retry 3 \
              --retry-delay 1 \
              --retry-max-time 20 \
              --retry-all-errors \
              --resolve "$APP_DOMAIN:443:127.0.0.1" \
              "$url" >/dev/null
          }

          local_https_check "https://$APP_DOMAIN/up"
          local_https_check "https://$APP_DOMAIN/site.webmanifest"
          local_https_check "https://$APP_DOMAIN/sw.js"

          if [ "$TELEGRAM_SETUP_REQUESTED" -eq 1 ]; then
            echo "Running safe Telegram Bot diagnostics on VPS..."
            cd "$BASE_DIR/current"
            $SUDO php8.3 artisan telegram:bot:diagnose || true
          fi

          echo "Local deployment checks passed."

          ls -1dt "$RELEASES_DIR"/* 2>/dev/null | tail -n +4 | xargs -r $SUDO rm -rf
          REMOTE

      - name: Configure Telegram webhook from GitHub runner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN is not configured; skipping Telegram webhook setup."
            exit 0
          fi

          TELEGRAM_WEBHOOK_SECRET="$(
            printf '%s' "zampolit73-webhook-v1:$TELEGRAM_BOT_TOKEN"               | sha256sum               | awk '{print $1}'
          )"

          get_me="$(
            curl               --silent               --show-error               --connect-timeout 8               --max-time 20               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe"               || true
          )"

          if ! printf '%s' "$get_me" | jq -e '.ok == true' >/dev/null 2>&1; then
            description="$(printf '%s' "$get_me" | jq -r '.description // "Telegram API did not return JSON"' 2>/dev/null || printf 'Telegram API did not return a response')"
            echo "::warning::Telegram Bot token validation failed: $description"
            exit 0
          fi

          bot_username="$(printf '%s' "$get_me" | jq -r '.result.username // "unknown"')"
          echo "Telegram Bot token validated for @${bot_username}."

          WEBHOOK_IPV4="$(getent ahostsv4 "$APP_DOMAIN" | awk '{print $1}' | sort -u | head -n 1)"
          if [ -n "$WEBHOOK_IPV4" ]; then
            echo "Telegram webhook pinned to IPv4 $WEBHOOK_IPV4."
          else
            echo "::warning::Could not resolve IPv4 for $APP_DOMAIN; Telegram will resolve the webhook hostname."
          fi

          webhook_response="$(
            curl               --silent               --show-error               --connect-timeout 8               --max-time 20               --request POST               --data-urlencode "url=https://${APP_DOMAIN}/api/telegram/bot/webhook"               --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}"               --data-urlencode 'allowed_updates=["message"]'               --data-urlencode "max_connections=5"               ${WEBHOOK_IPV4:+--data-urlencode "ip_address=${WEBHOOK_IPV4}"}               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook"               || true
          )"

          if ! printf '%s' "$webhook_response" | jq -e '.ok == true' >/dev/null 2>&1; then
            description="$(printf '%s' "$webhook_response" | jq -r '.description // "Telegram API did not return JSON"' 2>/dev/null || printf 'Telegram API did not return a response')"
            echo "::warning::Telegram webhook setup failed: $description"
            exit 0
          fi

          echo "Telegram webhook configured from GitHub runner for @${bot_username}."
          sleep 3

          webhook_info="$(
            curl               --silent               --show-error               --connect-timeout 8               --max-time 20               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo"               || true
          )"

          if printf '%s' "$webhook_info" | jq -e '.ok == true' >/dev/null 2>&1; then
            echo "Telegram webhook info:"
            printf '%s' "$webhook_info"               | jq -r '
                  .result
                  | "url=" + (.url // ""),
                    "pending_update_count=" + ((.pending_update_count // 0) | tostring),
                    "last_error_date=" + ((.last_error_date // 0) | tostring),
                    "last_error_message=" + (.last_error_message // "none")
                '
          else
            echo "::warning::Could not read Telegram getWebhookInfo."
          fi

          webhook_probe_status="$(
            curl               --silent               --output /dev/null               --write-out '%{http_code}'               --connect-timeout 8               --max-time 20               --request POST               --header "Content-Type: application/json"               --header "X-Telegram-Bot-Api-Secret-Token: ${TELEGRAM_WEBHOOK_SECRET}"               --data '{"update_id":0}'               "https://${APP_DOMAIN}/api/telegram/bot/webhook"               || true
          )"

          if [ "$webhook_probe_status" = "200" ]; then
            echo "Signed Telegram webhook endpoint probe: HTTP 200."
          else
            echo "::warning::Signed Telegram webhook endpoint probe returned HTTP ${webhook_probe_status:-no-response}."
          fi

  health:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 3

    steps:
      - name: Verify public HTTPS
        run: |
          set -euo pipefail

          echo "=== DNS diagnostics for $APP_DOMAIN ==="
          dns_output="$(getent ahostsv4 "$APP_DOMAIN" || true)"
          if [ -z "$dns_output" ]; then
            echo "::error::IPv4 DNS resolution failed for $APP_DOMAIN"
            exit 41
          fi
          printf '%s\n' "$dns_output"
          APP_IPV4="$(printf '%s\n' "$dns_output" | awk 'NR == 1 { print $1 }')"

          check_https() {
            label="$1"
            url="$2"

            echo "=== $label ==="
            curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 8 \
              --max-time 15 \
              --retry 3 \
              --retry-delay 2 \
              --retry-max-time 60 \
              --retry-all-errors \
              --resolve "$APP_DOMAIN:443:$APP_IPV4" \
              --output /dev/null \
              --write-out 'HTTP %{http_code} remote=%{remote_ip} dns=%{time_namelookup}s connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n' \
              "$url"
          }

          check_https "Laravel health" "https://$APP_DOMAIN/up"
          check_https "Homepage" "https://$APP_DOMAIN/"
          check_https "PWA manifest" "https://$APP_DOMAIN/site.webmanifest"
          check_https "Service worker" "https://$APP_DOMAIN/sw.js"
          redirect="$(curl \
            --silent \
            --show-error \
            --connect-timeout 5 \
            --max-time 12 \
            --retry 3 \
            --retry-delay 2 \
            --retry-max-time 45 \
            --retry-all-errors \
            --resolve "$APP_DOMAIN:80:$APP_IPV4" \
            --output /dev/null \
            --write-out '%{redirect_url}' \
            "http://$APP_DOMAIN/")"

          case "$redirect" in
            "https://$APP_DOMAIN"/*) ;;
            *)
              echo "::error::HTTP does not redirect to HTTPS: $redirect"
              exit 40
              ;;
          esac

          echo "Public HTTPS, redirect and PWA endpoint checks passed."

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: health
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 3

    steps:
      - name: Configure SSH authentication
        env:
          VPS_PWD: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          cat > ~/.ssh/askpass.sh <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "$VPS_PWD"
          ASKPASS
          chmod 700 ~/.ssh/askpass.sh

          timeout 10s ssh-keyscan -T 5 -p 22 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Send deploy push
        env:
          VPS_PWD: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_ASKPASS: /home/runner/.ssh/askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: ":0"
        run: |
          ssh \
            -p 22 \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            "$VPS_USER@$VPS_HOST" \
            "cd /var/www/zampolit73project/current && php8.3 artisan push:deploy-success" </dev/null
