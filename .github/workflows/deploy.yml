name: Deploy to AdminVPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install SSH client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Add VPS host key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p 22 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pack release
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            -czf /tmp/zampolit73project.tar.gz .

      - name: Upload release
        env:
          SSHPASS: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          sshpass -e scp \
            -P 22 \
            -o StrictHostKeyChecking=yes \
            /tmp/zampolit73project.tar.gz \
            "$VPS_USER@$VPS_HOST:/tmp/zampolit73project.tar.gz"

      - name: Deploy on VPS
        env:
          SSHPASS: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          sshpass -e ssh \
            -p 22 \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          APP_DIR="$HOME/apps/zampolit73project"
          mkdir -p "$APP_DIR"

          find "$APP_DIR" -mindepth 1 -maxdepth 1 \
            ! -name '.env' \
            ! -name 'data' \
            -exec rm -rf {} +

          tar -xzf /tmp/zampolit73project.tar.gz -C "$APP_DIR"
          rm -f /tmp/zampolit73project.tar.gz
          cd "$APP_DIR"

          if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            if [ "$(id -u)" -ne 0 ]; then
              echo "Docker/Compose is not installed and VPS_USER is not root."
              echo "Either use root for the first deployment or install Docker manually."
              exit 20
            fi

            echo "Installing Docker Engine and Docker Compose plugin on Ubuntu..."
            export DEBIAN_FRONTEND=noninteractive

            apt-get update
            apt-get install -y ca-certificates curl
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc

            . /etc/os-release
            CODENAME="${UBUNTU_CODENAME:-$VERSION_CODENAME}"

            echo \
              "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $CODENAME stable" \
              > /etc/apt/sources.list.d/docker.list

            apt-get update
            apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
            systemctl enable --now docker
          fi

          if docker info >/dev/null 2>&1; then
            DOCKER=(docker)
          elif sudo -n docker info >/dev/null 2>&1; then
            DOCKER=(sudo docker)
          else
            echo "Docker is installed, but this user cannot access the Docker daemon."
            exit 21
          fi

          COMPOSE_FILE=""
          for file in compose.yml compose.yaml docker-compose.yml docker-compose.yaml; do
            if [ -f "$file" ]; then
              COMPOSE_FILE="$file"
              break
            fi
          done

          if [ -z "$COMPOSE_FILE" ]; then
            echo "No Compose file found in $APP_DIR"
            exit 22
          fi

          if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
            if [ "$(id -u)" -eq 0 ]; then
              ufw allow 80/tcp
            elif sudo -n true >/dev/null 2>&1; then
              sudo ufw allow 80/tcp
            fi
          fi

          "${DOCKER[@]}" compose -f "$COMPOSE_FILE" pull
          "${DOCKER[@]}" compose -f "$COMPOSE_FILE" up -d --build --remove-orphans --force-recreate

          echo "Checking container state..."
          for attempt in $(seq 1 15); do
            STATUS="$("${DOCKER[@]}" inspect -f '{{.State.Status}}' zampolit73-web 2>/dev/null || true)"
            if [ "$STATUS" = "running" ]; then
              echo "Container is running."
              "${DOCKER[@]}" compose -f "$COMPOSE_FILE" ps
              exit 0
            fi
            sleep 2
          done

          echo "Container did not reach running state."
          "${DOCKER[@]}" compose -f "$COMPOSE_FILE" ps
          "${DOCKER[@]}" logs --tail=100 zampolit73-web || true
          exit 23
          REMOTE

      - name: Verify public HTTP
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          response="$(curl -fsS \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            "http://$VPS_HOST/healthz")"

          test "$response" = "ok"
          echo "Public health check passed."

          page="$(curl -fsS \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            "http://$VPS_HOST/")"

          printf '%s' "$page" | grep -Fq 'Привет, Валера!'
          echo "Main page content check passed."
