name: Purge obsolete SVOE feature branches

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/purge-svoe-branches.yml'

permissions:
  contents: write

jobs:
  purge:
    if: github.repository == 'zampolit73/zampolit73project'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Remove two named obsolete branches only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for ref in feature/svoe-family-finance fix/svoe-startup-health; do
            echo "Deleting only refs/heads/$ref"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" >/dev/null 2>&1; then
              echo "::error::Branch still exists: $ref"
              exit 1
            fi
            echo "Confirmed absent: $ref"
          done
