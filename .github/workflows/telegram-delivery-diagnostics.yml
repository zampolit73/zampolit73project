name: Telegram read-only delivery diagnostics
on:
  push:
    branches: [diagnostics/telegram-delivery-20261026]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Telegram delivery status
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          result="$(curl -fsS --connect-timeout 8 --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getWebhookInfo")"
          printf '%s' "$result" | jq -e '.ok == true' >/dev/null
          printf '%s' "$result" | jq '.result | {url,pending_update_count,last_error_date,last_error_message,allowed_updates}'
      - name: Read local bot state and webhook response statuses
        env:
          VPS_PWD: ${{ secrets.VPS_PWD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_ASKPASS: /home/runner/.ssh/askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: ":0"
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          cat > ~/.ssh/askpass.sh <<'ASKPASS'
          #!/usr/bin/env bash
          printf '%s\n' "$VPS_PWD"
          ASKPASS
          chmod 700 ~/.ssh/askpass.sh
          timeout 10s ssh-keyscan -T 5 -p 22 -H "$VPS_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -p 22 -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /var/www/zampolit73project/current
          if [ "$(id -u)" -eq 0 ]; then
            runuser -u www-data -- php8.3 artisan telegram:bot:diagnose --local-only
            tail -n 1000 /var/log/nginx/access.log | awk '$7 ~ /^\/api\/telegram\/bot\/webhook/ {print $4" "$5, "status="$9}' | tail -n 20
          else
            sudo -n -u www-data php8.3 artisan telegram:bot:diagnose --local-only
            sudo -n tail -n 1000 /var/log/nginx/access.log | awk '$7 ~ /^\/api\/telegram\/bot\/webhook/ {print $4" "$5, "status="$9}' | tail -n 20
          fi
          systemctl is-active zampolit73project-telegram-bot.service
          REMOTE
